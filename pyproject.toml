[project]
name = "agent-emails"
version = "0.1.0"
description = "Agent IA de tri des emails pour PME"
requires-python = ">=3.12"
dependencies = [
    "agent-factures",
    "anthropic>=1.9.0",
    "pandas>=3.0.6",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_emails"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
agent-factures = { git = "https://github.com/micouaidan55/agent-factures" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
